[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-disposal"
version = "0.1.0"
description = "Simulation-only secure device-disposal planner (NIST SP 800-88 oriented). Performs no destructive operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime uses only the Python standard library. No third-party runtime deps.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
disposal = "disposal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
